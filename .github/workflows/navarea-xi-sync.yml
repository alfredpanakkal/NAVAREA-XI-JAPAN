name: NAVAREA XI Ingestion Pipeline

on:
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours
  push:
    branches:
      - main
    paths:
      - 'navarea_xi_scraper.py'
      - 'navarea_xi_parser.py'
      - 'navarea_xi_sync.py'
      - 'run_xi_pipeline.py'
      - 'requirements.txt'
      - '.github/workflows/navarea-xi-sync.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

concurrency:
  group: navarea-xi-sync-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest-navarea-xi-warnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Test Suite
        run: |
          python -m unittest tests/test_navarea_xi.py

      - name: Harvest Bulletins (Stage 1 Scraper)
        run: |
          python navarea_xi_scraper.py

      - name: Normalize & Classify (Stage 2 Parser)
        run: |
          python navarea_xi_parser.py

      - name: Verify Scraper & Parser Output Files
        run: |
          if [ ! -f navarea_xi_warnings.txt ]; then
            echo "Scraper error: navarea_xi_warnings.txt not generated!"
            exit 1
          fi
          if [ ! -f parsed_xi_warnings.json ]; then
            echo "Parser error: parsed_xi_warnings.json not generated!"
            exit 1
          fi
          echo "Output files verified successfully."

      - name: Differential Sync to Supabase (Stage 3 Sync)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python navarea_xi_sync.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navarea-xi-warnings-data
          path: |
            navarea_xi_warnings.txt
            parsed_xi_warnings.json
          retention-days: 7
          if-no-files-found: ignore
